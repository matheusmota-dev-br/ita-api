<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditoria — ITA API</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2713%27 font-size=%2713%27%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --panel-2: #222630; --line: #2e333d;
    --fg: #e6e8ec; --dim: #98a0ae; --faint: #6b7280;
    --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --accent: #60a5fa;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #fff; --panel-2: #eef0f4; --line: #d9dde4;
      --fg: #14161a; --dim: #5b6472; --faint: #8b93a1;
      --ok: #15803d; --bad: #b91c1c; --warn: #a16207; --accent: #1d4ed8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  #app { display: grid; grid-template-columns: 290px 210px 1fr; height: 100vh; }
  .col { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  .col:last-child { border-right: 0; background: var(--bg); }
  .head {
    position: sticky; top: 0; z-index: 2; padding: 10px 12px;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
    font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--dim);
  }
  .head input {
    width: 100%; margin-top: 8px; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
    font: inherit; text-transform: none; letter-spacing: 0;
  }
  .row {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; display: flex; gap: 8px; align-items: baseline;
  }
  .row:hover { background: var(--panel-2); }
  .row.sel { background: var(--accent); color: #fff; }
  .row.sel .sub, .row.sel .pill { color: #fff; opacity: .85; }
  .row .main { flex: 1; min-width: 0; }
  .row .name { font-variant-numeric: tabular-nums; }
  .sub { font-size: 11px; color: var(--dim); }
  .pill {
    font-size: 11px; font-variant-numeric: tabular-nums; color: var(--faint);
    white-space: nowrap;
  }
  .qgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
  .q {
    padding: 8px 2px; text-align: center; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel-2);
    font-variant-numeric: tabular-nums; position: relative;
  }
  .q:hover { border-color: var(--accent); }
  .q.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
  .q .dot {
    position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%;
  }
  .dot.human_verified { background: var(--ok); }
  .dot.rejected { background: var(--bad); }
  .dot.llm_generated { background: var(--warn); }
  main { padding: 16px 20px 60px; max-width: 1100px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .meta { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .meta code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px; margin-bottom: 14px;
  }
  .card > h3 {
    margin: 0 0 10px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--dim); font-weight: 600;
  }
  img.shot {
    max-width: 100%; border: 1px solid var(--line); border-radius: 6px;
    background: #fff; display: block; margin-bottom: 8px;
  }
  pre {
    white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim); max-height: 320px; overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.letter { width: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  tr.correct { background: color-mix(in srgb, var(--ok) 14%, transparent); }
  tr.correct td.letter { color: var(--ok); }
  .actions {
    position: fixed; bottom: 0; right: 0; left: 500px; padding: 10px 20px;
    background: var(--panel-2); border-top: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  button {
    font: inherit; padding: 7px 14px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  button:hover { border-color: var(--accent); }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grow { flex: 1; }
  .kbd {
    font-size: 11px; color: var(--faint); font-family: ui-monospace, monospace;
  }
  .empty { color: var(--faint); padding: 24px 12px; font-size: 13px; }
  .bar { height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .warn { color: var(--warn); font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  /* A barra de recorte acompanha a rolagem: a página é alta e o botão de
     aplicar precisa continuar alcançável enquanto se procura a região. */
  .tabs.sticky {
    position: sticky; top: 0; z-index: 3; padding: 8px 0;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .pagewrap {
    position: relative; display: inline-block; cursor: crosshair;
    user-select: none; -webkit-user-select: none;
  }
  .pagewrap img { display: block; }
  /* Nome distinto de .row.sel / .q.sel, que marcam o item selecionado. */
  .croprect {
    position: absolute; border: 2px solid var(--accent); pointer-events: none;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  textarea {
    width: 100%; min-height: 90px; font: 12.5px/1.5 ui-monospace, Menlo, monospace;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  input.alt {
    width: 100%; font: inherit; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px;
  }
  input.alt:focus { outline: none; border-color: var(--accent); }
  .tag {
    font-size: 10.5px; padding: 2px 7px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .tag.on { border-color: var(--warn); color: var(--warn); }
  .tag.off { border-color: var(--ok); color: var(--ok); }
  .dot.edited { background: var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createElement as h, useState, useEffect, useCallback, useRef } from "/static/vendor/react.js";
import { createRoot } from "/static/vendor/react-dom.js";
import htm from "/static/vendor/htm.js";
const html = htm.bind(h);

const api = (path) => fetch(path).then((r) => (r.ok ? r.json() : Promise.reject(r.status)));

function Bar({ doc }) {
  const total = doc.question_count || 0;
  if (!total) return null;
  const pct = (n) => `${(100 * n) / total}%`;
  return html`<div class="bar">
    <i style=${{ width: pct(doc.reviewed_count), background: "var(--ok)" }}></i>
    <i style=${{ width: pct(doc.rejected_count), background: "var(--bad)" }}></i>
  </div>`;
}

function Documents({ docs, sel, onSelect }) {
  const [filter, setFilter] = useState("");
  const term = filter.trim().toLowerCase();
  const shown = docs.filter(
    (d) =>
      !term ||
      d.exam_slug.includes(term) ||
      (d.discipline || "").includes(term) ||
      d.source_column.includes(term)
  );
  return html`<div class="col">
    <div class="head">
      ${docs.length} documentos
      <input
        placeholder="filtrar: 2025, fisica, gabarito…"
        value=${filter}
        onInput=${(e) => setFilter(e.target.value)} />
    </div>
    ${shown.map(
      (d) => html`<div
        key=${d.id}
        class=${"row" + (sel === d.id ? " sel" : "")}
        onClick=${() => onSelect(d.id)}>
        <div class="main">
          <div class="name">
            ${d.exam_slug}${d.discipline ? ` · ${d.discipline}` : ""}
            ${d.kind === "gabarito" ? " · gabarito" : ""}
          </div>
          <div class="sub">
            ${d.kind === "gabarito"
              ? `${d.answer_count} respostas`
              : `${d.question_count} questões`}
            ${d.kind !== "gabarito" && d.with_answer_count
              ? ` · ${d.with_answer_count} c/ gabarito`
              : ""}
            ${d.page_count ? ` · ${d.page_count}pg` : ""}
          </div>
          <${Bar} doc=${d} />
        </div>
        <span class="pill">${d.kind === "gabarito" ? d.answer_count : `${d.reviewed_count}/${d.question_count}`}</span>
      </div>`
    )}
    ${!shown.length && html`<div class="empty">nada corresponde ao filtro</div>`}
  </div>`;
}

function Questions({ questions, sel, onSelect, doc }) {
  const isKey = doc && doc.kind === "gabarito";
  return html`<div class="col">
    <div class="head">
      ${isKey ? `${doc.answer_count} respostas` : `${questions.length} questões`}
    </div>
    ${questions.length
      ? html`<div class="qgrid">
          ${questions.map(
            (q) => html`<div
              key=${q.id}
              class=${"q" + (sel === q.id ? " sel" : "")}
              onClick=${() => onSelect(q.id)}>
              ${q.number}
              <span class=${"dot " + q.review_status}></span>
            </div>`
          )}
        </div>`
      : html`<div class="empty">
          ${isKey
            ? "gabarito: as respostas aparecem no painel à direita"
            : doc
              ? "nenhuma questão detectada neste documento — é um dos casos que precisam do fallback de LLM"
              : "escolha um documento"}
        </div>`}
  </div>`;
}

// O numero da pagina vem de `pages[0].page_no`; `source.page_start` e o
// fallback. Nao existe `page_start` no topo do objeto — ler de la produzia
// /pages/undefined/image e um 422.
const firstPage = (q) =>
  (q && q.pages && q.pages.length ? q.pages[0].page_no : null) ??
  (q && q.source ? q.source.page_start : 0) ??
  0;

function PageView({ doc, question, onCrop, busy }) {
  const [page, setPage] = useState(() => firstPage(question));
  const [drag, setDrag] = useState(null);
  const imgRef = useRef(null);
  useEffect(() => {
    setPage(firstPage(question));
    setDrag(null);
  }, [question && question.id]);
  if (!doc || !Number.isInteger(page)) return null;

  const last = (doc.page_count || 1) - 1;
  const src =
    `/api/v1/documents/${doc.id}/pages/${page}/image` +
    `?boxes=1&highlight=${question ? question.number : ""}`;

  // A imagem e renderizada a DPI conhecido e exibida escalada pelo CSS. Para
  // converter um clique em pontos do PDF: fracao da largura exibida x largura
  // da pagina em pontos (= pixels naturais / (dpi/72)).
  const toPdf = (e) => {
    const img = imgRef.current;
    const r = img.getBoundingClientRect();
    const pageW = img.naturalWidth / (110 / 72);
    const pageH = img.naturalHeight / (110 / 72);
    return {
      x: ((e.clientX - r.left) / r.width) * pageW,
      y: ((e.clientY - r.top) / r.height) * pageH,
      fx: (e.clientX - r.left) / r.width,
      fy: (e.clientY - r.top) / r.height,
    };
  };

  const onDown = (e) => {
    const p = toPdf(e);
    setDrag({ a: p, b: p });
    e.preventDefault();
  };
  const onMove = (e) => drag && setDrag({ ...drag, b: toPdf(e) });
  const onUp = () => {
    if (!drag) return;
    const { a, b } = drag;
    if (Math.abs(a.x - b.x) < 8 || Math.abs(a.y - b.y) < 8) return setDrag(null);
  };

  const rect = drag && {
    left: `${100 * Math.min(drag.a.fx, drag.b.fx)}%`,
    top: `${100 * Math.min(drag.a.fy, drag.b.fy)}%`,
    width: `${100 * Math.abs(drag.a.fx - drag.b.fx)}%`,
    height: `${100 * Math.abs(drag.a.fy - drag.b.fy)}%`,
  };

  const apply = () => {
    const { a, b } = drag;
    onCrop({
      page_no: page,
      part_index: 0,
      x0: Math.min(a.x, b.x),
      y0: Math.min(a.y, b.y),
      x1: Math.max(a.x, b.x),
      y1: Math.max(a.y, b.y),
    });
    setDrag(null);
  };

  return html`<div class="card">
    <h3>Página com as regiões detectadas</h3>
    <div class=${"tabs" + (drag ? " sticky" : "")}>
      <button onClick=${() => setPage(Math.max(0, page - 1))} disabled=${page <= 0}>‹</button>
      <span class="pill">página ${page} de ${last}</span>
      <button onClick=${() => setPage(Math.min(last, page + 1))} disabled=${page >= last}>›</button>
      <span class="grow"></span>
      ${drag
        ? html`<button class="ok" onClick=${apply} disabled=${busy}>
              ✓ Usar esta região como recorte
            </button>
            <button onClick=${() => setDrag(null)}>Cancelar</button>
            <span class="kbd">
              ${Math.round(Math.abs(drag.a.x - drag.b.x))}×${Math.round(
                Math.abs(drag.a.y - drag.b.y)
              )} pt
            </span>`
        : html`<span class="kbd">arraste sobre a página para corrigir o recorte</span>`}
    </div>
    <div
      class="pagewrap"
      onMouseDown=${onDown}
      onMouseMove=${onMove}
      onMouseUp=${onUp}
      onMouseLeave=${onUp}>
      <img ref=${imgRef} class="shot" src=${src} alt=${"pagina " + page} draggable=${false} />
      ${rect && html`<div class="croprect" style=${rect}></div>`}
    </div>
  </div>`;
}

function Editor({ question, onSave, busy }) {
  const [text, setText] = useState(question.statement_markdown || "");
  const [alts, setAlts] = useState({});
  const [dirty, setDirty] = useState(false);
  useEffect(() => {
    setText(question.statement_markdown || "");
    setAlts(
      Object.fromEntries(
        (question.alternatives || []).map((a) => [a.letter, a.text_markdown || ""])
      )
    );
    setDirty(false);
  }, [question.id]);

  const setAlt = (letter, value) => {
    setAlts({ ...alts, [letter]: value });
    setDirty(true);
  };

  return html`<div class="card">
    <h3>
      Correção manual
      <span class="kbd" style=${{ textTransform: "none", marginLeft: "8px" }}>
        salvar marca a questão como revisada e dispensa o LLM
      </span>
    </h3>
    <textarea
      placeholder=${"Enunciado em Markdown/LaTeX. Vazio = ainda não corrigido.\n\nUse $...$ para matemática inline."}
      value=${text}
      onInput=${(e) => { setText(e.target.value); setDirty(true); }} />
    ${(question.alternatives || []).length
      ? html`<table style=${{ marginTop: "10px" }}><tbody>
          ${question.alternatives.map(
            (a) => html`<tr key=${a.letter}>
              <td class="letter">${a.letter}</td>
              <td>
                <input
                  class="alt"
                  value=${alts[a.letter] ?? ""}
                  placeholder=${a.text_raw || "(sem texto)"}
                  onInput=${(e) => setAlt(a.letter, e.target.value)} />
              </td>
            </tr>`
          )}
        </tbody></table>`
      : ""}
    <div class="tabs" style=${{ marginTop: "10px", marginBottom: 0 }}>
      <button
        class=${dirty ? "ok" : ""}
        disabled=${busy || !dirty}
        onClick=${() => { onSave(text, alts); setDirty(false); }}>
        Salvar correção
      </button>
      ${dirty && html`<span class="kbd">alterações não salvas</span>`}
    </div>
  </div>`;
}

function Detail({ doc, question, onReview, onCrop, onSave, busy }) {
  if (!question)
    return html`<main><div class="empty">
      Escolha um documento e uma questão. Setas ↑↓ navegam, A aprova, R rejeita.
    </div></main>`;

  const alts = question.alternatives || [];
  return html`<main>
    <h2>Questão ${question.number} · ${question.year} ${question.phase}</h2>
    <div class="meta">
      ${question.discipline || "sem matéria"}
      ${question.discipline_source ? html` (via ${question.discipline_source})` : ""}
      · status <code>${question.review_status}</code>
      · páginas ${question.source ? `${question.source.page_start}–${question.source.page_end}` : "?"}
      ${question.has_figure ? " · tem figura" : ""}
      ${question.needs_llm === true
        ? html` · <span class="tag on">marcada: precisa de LLM</span>`
        : question.needs_llm === false
          ? html` · <span class="tag off">marcada: dispensa LLM</span>`
          : ""}
      <br />fonte: <code>${question.source ? question.source.local_path : ""}</code>
    </div>

    <div class="card">
      <h3>Recorte da questão (${(question.pages || []).length} parte(s))</h3>
      ${(question.pages || []).map(
        (p) => html`<img
          key=${p.part_index}
          class="shot"
          src=${`/api/v1/questions/${question.id}/image?part=${p.part_index}`}
          alt=${"recorte parte " + p.part_index} />`
      )}
    </div>

    <${PageView} doc=${doc} question=${question} onCrop=${onCrop} busy=${busy} />

    ${alts.length
      ? html`<div class="card">
          <h3>Alternativas</h3>
          <table><tbody>
            ${alts.map(
              (a) => html`<tr key=${a.letter} class=${a.is_correct ? "correct" : ""}>
                <td class="letter">${a.letter}</td>
                <td>${a.text_markdown || a.text_raw || html`<span class="pill">sem texto — o enrich ainda não rodou</span>`}</td>
                <td class="pill">${a.is_correct === true ? "gabarito" : a.is_correct === null ? "—" : ""}</td>
              </tr>`
            )}
          </tbody></table>
        </div>`
      : ""}

    <${Editor} question=${question} onSave=${onSave} busy=${busy} />

    <div class="card">
      <h3>Texto bruto extraído do PDF</h3>
      <pre>${question.statement_raw || "(vazio)"}</pre>
    </div>

    <div class="actions">
      <button class=${"ok" + (question.review_status === "human_verified" ? " on" : "")}
        disabled=${busy} onClick=${() => onReview("human_verified")}>
        ✓ Aprovar <span class="kbd">A</span>
      </button>
      <button class=${"bad" + (question.review_status === "rejected" ? " on" : "")}
        disabled=${busy} onClick=${() => onReview("rejected")}>
        ✕ Rejeitar <span class="kbd">R</span>
      </button>
      <button disabled=${busy} onClick=${() => onReview("raw")}>Limpar</button>
      <span style=${{ width: "16px" }}></span>
      <span class="kbd">LLM:</span>
      <button
        class=${question.needs_llm === true ? "on" : ""}
        disabled=${busy}
        onClick=${() => onReview(null, { needs_llm: true })}>
        precisa <span class="kbd">L</span>
      </button>
      <button
        class=${question.needs_llm === false ? "on" : ""}
        disabled=${busy}
        onClick=${() => onReview(null, { needs_llm: false })}>
        dispensa <span class="kbd">D</span>
      </button>
      <span class="grow"></span>
      <span class="kbd">↑↓ navega · ←→ documento</span>
    </div>
  </main>`;
}

function AnswerKey({ doc }) {
  const [answers, setAnswers] = useState(null);
  const [page, setPage] = useState(0);
  useEffect(() => {
    setAnswers(null);
    if (doc) api(`/api/v1/documents/${doc.id}/answers`).then(setAnswers);
  }, [doc && doc.id]);
  if (!doc) return null;

  const byColumn = {};
  for (const a of answers || []) (byColumn[a.column] ??= []).push(a);
  const unlabelled = (answers || []).filter((a) => !a.discipline).length;

  return html`<main>
    <h2>Gabarito · ${doc.exam_slug}</h2>
    <div class="meta">
      ${(answers || []).length} respostas em ${Object.keys(byColumn).length} colunas
      ${unlabelled ? html` · <span class="warn">${unlabelled} sem matéria identificada</span>` : ""}
      <br />fonte: <code>${doc.local_path}</code>
    </div>

    <div class="card">
      <h3>Respostas parseadas</h3>
      ${answers === null
        ? html`<div class="empty">carregando…</div>`
        : html`<div style=${{ display: "flex", gap: "18px", flexWrap: "wrap" }}>
            ${Object.entries(byColumn).map(
              ([col, list]) => html`<div key=${col}>
                <div class="sub" style=${{ marginBottom: "4px" }}>
                  coluna ${col} · ${list[0].discipline || "sem matéria"}
                </div>
                <table><tbody>
                  ${list.map(
                    (a) => html`<tr key=${a.number}>
                      <td class="letter">${a.number}</td>
                      <td style=${{ fontWeight: 700 }}>
                        ${a.annulled ? html`<span class="warn">anulada</span>` : a.letter}
                      </td>
                    </tr>`
                  )}
                </tbody></table>
              </div>`
            )}
          </div>`}
    </div>

    <div class="card">
      <h3>PDF do gabarito</h3>
      <div class="tabs">
        <button onClick=${() => setPage(Math.max(0, page - 1))} disabled=${page <= 0}>‹</button>
        <span class="pill" style=${{ alignSelf: "center" }}>
          página ${page} de ${(doc.page_count || 1) - 1}
        </span>
        <button
          onClick=${() => setPage(Math.min((doc.page_count || 1) - 1, page + 1))}
          disabled=${page >= (doc.page_count || 1) - 1}>›</button>
      </div>
      <img class="shot" src=${`/api/v1/documents/${doc.id}/pages/${page}/image?boxes=0&dpi=150`} />
    </div>
  </main>`;
}

function App() {
  const [docs, setDocs] = useState([]);
  const [docId, setDocId] = useState(null);
  const [questions, setQuestions] = useState([]);
  const [qid, setQid] = useState(null);
  const [detail, setDetail] = useState(null);
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState(null);
  const [imgKey, setImgKey] = useState(0);
  const detailRef = useRef(null);

  const reloadDocs = useCallback(() => {
    api("/api/v1/documents").then(setDocs);
    api("/api/v1/documents/progress").then(setProgress);
  }, []);
  useEffect(reloadDocs, [reloadDocs]);

  // Carrega as questões do documento selecionado.
  useEffect(() => {
    if (docId == null) return;
    setQuestions([]);
    setQid(null);
    setDetail(null);
    api(`/api/v1/documents/${docId}/questions`).then(async (ids) => {
      const loaded = await Promise.all(ids.map((id) => api(`/api/v1/questions/${id}`)));
      setQuestions(loaded);
      if (loaded.length) setQid(loaded[0].id);
    });
  }, [docId]);

  useEffect(() => {
    const found = questions.find((q) => q.id === qid) || null;
    setDetail(found);
    detailRef.current = found;
    // Rola o painel de detalhe de volta ao topo ao trocar de questão.
    const main = document.querySelector("main");
    if (main) main.scrollTop = 0;
  }, [qid, questions]);

  // Um unico caminho de escrita: status, triagem, texto e recorte vao todos
  // pelo mesmo endpoint, que grava no banco e no decisions.json.
  const post = useCallback(
    async (patch) => {
      const q = detailRef.current;
      if (!q) return;
      setBusy(true);
      try {
        const res = await fetch(`/api/v1/questions/${q.id}/review`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(patch),
        });
        if (!res.ok) return;
        // Rele a questao do servidor: um recorte novo muda imagem, bbox e
        // texto bruto, e adivinhar isso no cliente sairia dessincronizado.
        const fresh = await api(`/api/v1/questions/${q.id}?t=${Date.now()}`);
        setQuestions((prev) => prev.map((x) => (x.id === q.id ? fresh : x)));
        setImgKey((k) => k + 1);
        reloadDocs();
      } finally {
        setBusy(false);
      }
    },
    [reloadDocs]
  );

  const review = useCallback(
    (status, extra = {}) => post(status ? { status, ...extra } : extra),
    [post]
  );
  const crop = useCallback((bbox) => post({ bbox }), [post]);
  const save = useCallback(
    (statement_markdown, alternatives) =>
      post({ statement_markdown, alternatives, needs_llm: false }),
    [post]
  );

  // Navegação por teclado: auditar 2489 questões no mouse seria inviável.
  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === "INPUT") return;
      const qIndex = questions.findIndex((q) => q.id === qid);
      const dIndex = docs.findIndex((d) => d.id === docId);
      if (e.key === "ArrowDown" || e.key === "j") {
        if (qIndex >= 0 && qIndex < questions.length - 1) setQid(questions[qIndex + 1].id);
        e.preventDefault();
      } else if (e.key === "ArrowUp" || e.key === "k") {
        if (qIndex > 0) setQid(questions[qIndex - 1].id);
        e.preventDefault();
      } else if (e.key === "ArrowRight") {
        if (dIndex >= 0 && dIndex < docs.length - 1) setDocId(docs[dIndex + 1].id);
        e.preventDefault();
      } else if (e.key === "ArrowLeft") {
        if (dIndex > 0) setDocId(docs[dIndex - 1].id);
        e.preventDefault();
      } else if (e.key === "a" || e.key === "A") {
        review("human_verified");
      } else if (e.key === "r" || e.key === "R") {
        review("rejected");
      } else if (e.key === "l" || e.key === "L") {
        review(null, { needs_llm: true });
      } else if (e.key === "d" || e.key === "D") {
        review(null, { needs_llm: false });
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [questions, qid, docs, docId, review]);

  const doc = docs.find((d) => d.id === docId) || null;

  return html`
    <${Documents} docs=${docs} sel=${docId} onSelect=${setDocId} />
    <${Questions} questions=${questions} sel=${qid} onSelect=${setQid} doc=${doc} />
    <div class="col">
      ${progress &&
      html`<div class="head">
        auditoria: ${progress.reviewed} aprovadas · ${progress.rejected} rejeitadas ·
        ${progress.pending} pendentes de ${progress.total}
      </div>`}
      ${doc && doc.kind === "gabarito"
        ? html`<${AnswerKey} doc=${doc} />`
        : html`<${Detail}
            key=${imgKey}
            doc=${doc}
            question=${detail}
            onReview=${review}
            onCrop=${crop}
            onSave=${save}
            busy=${busy} />`}
    </div>`;
}

createRoot(document.getElementById("app")).render(html`<${App} />`);
</script>
</body>
</html>
