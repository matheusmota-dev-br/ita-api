name: CI

on:
  pull_request:
    branches: [main]

jobs:
  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite+aiosqlite:///./data/ci.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run migrations
        run: pipenv run python -m alembic -c alembic.ini upgrade head

  tests:
    name: Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite+aiosqlite:///./data/ci.db

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      # Os testes constroem seus próprios bancos temporários e PDFs sintéticos:
      # não dependem do corpus baixado, que é gitignored.
      - name: Run tests
        # A suite de navegador precisa de Chrome; ela se auto-skipa quando nao
        # ha, mas ignorar o diretorio deixa isso explicito no log do CI.
        run: pipenv run pytest -q --ignore=tests/e2e --cov=src --cov-report=term

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Ruff check
        run: pipenv run ruff check .

      - name: Ruff format check
        run: pipenv run ruff format --check .

      # O banner do README é gerado a partir do baseline versionado. Se alguém
      # atualizar as contagens sem redesenhá-lo, o gráfico passa a mentir — e
      # isso é invisível numa review. Só stdlib, então roda sem o corpus.
      - name: Banner em dia com o baseline
        run: PYTHONPATH=. pipenv run python -m tools.banner --check
